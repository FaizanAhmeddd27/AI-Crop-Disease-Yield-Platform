# Experiment Y-03: Extreme Gradient Boosting (XGBoost) Yield Regressor
exp_id: "Y-03-xgboost"
model_name: "xgboost"
n_estimators: 300
max_depth: 4
learning_rate: 0.04
subsample: 0.8
colsample_bytree: 0.8
reg_alpha: 0.1
reg_lambda: 1.0
early_stopping_rounds: 20
random_state: 42
split:
  train_end_year: 2021
  val_year: 2022
  test_start_year: 2023
