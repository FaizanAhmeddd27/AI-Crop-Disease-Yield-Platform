# Experiment D-06: EfficientNet-B0 with Strong Augmentation + Label Smoothing Regularization
exp_id: "D-06"
name_suffix: "effnetb0-regularized"
architecture: "efficientnet_b0"
pretrained: true
freeze_backbone: false

# Data & Augmentation
img_size: 224
batch_size: 32
aug_policy: "strong"
seed: 42

# Optimization with Label Smoothing (0.1) for better probability calibration
epochs: 10
lr: 0.0003
optimizer: "adamw"
weight_decay: 0.0001
label_smoothing: 0.1
