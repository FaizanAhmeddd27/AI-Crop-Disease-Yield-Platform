# Experiment D-05: EfficientNet-B0 with Strong Augmentations (Domain gap mitigation)
exp_id: "D-05"
name_suffix: "effnetb0-strongaug"
architecture: "efficientnet_b0"
pretrained: true
freeze_backbone: false

# Data & Augmentation
img_size: 224
batch_size: 32
aug_policy: "strong"
seed: 42

# Optimization
epochs: 10
lr: 0.0003
optimizer: "adamw"
weight_decay: 0.0001
label_smoothing: 0.0
