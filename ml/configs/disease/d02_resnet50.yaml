# Experiment D-02: ResNet-50 fine-tuning (ImageNet pretrained)
exp_id: "D-02"
name_suffix: "resnet50"
architecture: "resnet50"
pretrained: true
freeze_backbone: false

# Data & Augmentation
img_size: 224
batch_size: 32
aug_policy: "basic"
seed: 42

# Optimization
epochs: 10
lr: 0.0003
optimizer: "adamw"
weight_decay: 0.0001
label_smoothing: 0.0
