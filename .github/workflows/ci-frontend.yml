name: Frontend CI

on:
  pull_request:
    paths: ["frontend/**", ".github/workflows/ci-frontend.yml"]
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/ci-frontend.yml"]

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Route types (LayoutProps/PageProps) are generated, not shipped in the
      # repo — generate them before type-checking (docs: next typegen).
      - run: npx next typegen && npx tsc --noEmit --pretty false
      - run: npm test
      - run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
